services:
  corolive-backend:
    build: .
    container_name: corolive-backend
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland                 # container clock and local date
      COROLIVE_TIMEZONE: Pacific/Auckland  # solar timezone; keep the same as TZ
      COROLIVE_DAWN_DEPRESSION: "18"       # start angle: 6=civil, 12=nautical, 18=astronomical
      COROLIVE_DUSK_DEPRESSION: "18"       # stop angle: 6=civil, 12=nautical, 18=astronomical
      COROLIVE_BEFORE_DAWN_MIN: "6"        # start this many minutes before calculated dawn
      COROLIVE_AFTER_DUSK_MIN: "6"         # stop this many minutes after calculated dusk
      COROLIVE_ANIMATE_AT: "23:00"         # build timelapses after the final summer capture
    volumes:
      - ./data:/data                # all captured data lives here
      - ./config:/config:ro         # cameras.yaml (read-only)

  corolive-web:
    image: nginxinc/nginx-unprivileged:alpine   # runs as non-root (uid 101)
    container_name: corolive-web
    restart: unless-stopped
    ports:
      - "8080:8080"                 # browse/serve the data tree here
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: /mnt/nfs/corolive     # archived years live on the Docker host
        target: /mnt/nfs/corolive
        read_only: true
        bind:
          create_host_path: false     # fail instead of serving an empty directory
    read_only: true                 # container filesystem is immutable
    tmpfs:                          # ...except the few dirs nginx must write
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL                         # static serving needs no capabilities
    security_opt:
      - no-new-privileges:true      # block privilege escalation
    mem_limit: 64m
    pids_limit: 100
