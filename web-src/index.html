                <div class="card text-center">

                        <a href="/whitianga"><img id="whitianga-thumbnail"

            <div class="col-sm-3">

    <script>
        setInterval(function () {
            Object.keys(CAMERAS).forEach(function (id) {
                document.getElementById(id + '-thumbnail').src = snap(id) + '?rand=' + Math.random();
            });
        }, 15000);
    </script>
