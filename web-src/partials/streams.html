    <script>
        // Single source of truth for camera config - add a new camera here only.
        var API = 'https://api.corolive.nz';
        var CAMERAS = {
            whitianga:  { name: 'Whitianga',  stream: '283795aa-816e-4d95-8ac0-05cabb67c05e', start: '2019-03-17' },
            whangamata: { name: 'Whangamata', stream: 'd456ab62-df95-4872-a96a-734ff455996e', start: '2021-03-17' },
            thames:     { name: 'Thames',     stream: 'afb4677d-4dc4-44e9-94dd-de5fb0b68c29', start: '2021-05-06' }
        };
        function m3u8(camera) { return API + '/memfs/' + CAMERAS[camera].stream + '.m3u8'; }
        function snap(camera) { return API + '/' + camera + '/snap.webp'; }

        // Camera from ?camera=, or null when absent/unknown.
        function queryCamera() {
            var c = new URLSearchParams(location.search).get('camera');
            return Object.prototype.hasOwnProperty.call(CAMERAS, c) ? c : null;
        }
    </script>
